<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#D6293A">
<meta name="description" content="dib & candy — بوكسات هدايا، اندومي وتوبوكي، سويتس وكاندي، وسناكس. اختار اللي نفسك فيه واطلب من واتساب.">
<title>🍭 dib &amp; candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #FBF1DF;
  --paper-2: #F5E6C8;
  --card: #FFFCF5;
  --ink: #2A1E19;
  --ink-soft: #6B564A;
  --red: #D6293A;
  --red-deep: #A81D2C;
  --gold: #F2A93B;
  --gold-deep: #D98826;
  --green: #2E9E68;
  --rose: #E2496B;
  --line: #E9D6AE;

  --font-display: "Baloo Bhaijaan 2", "Cairo", sans-serif;
  --font-body: "Cairo", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

body {
  font-family: var(--font-body);
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 0%, #FCEBC9 0%, transparent 45%),
    radial-gradient(circle at 85% 10%, #FBE3C9 0%, transparent 40%),
    var(--paper);
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 18px;
  position: relative;
}

.container {
  position: relative;
  z-index: 1;
  max-width: 480px;
  width: 100%;
}

/* ---------------- Header (matches shop header) ---------------- */

.header {
  position: relative;
  text-align: center;
  padding: 34px 16px 28px;
  margin-bottom: 24px;
  background: linear-gradient(180deg, #FFF6E4 0%, var(--paper) 100%);
  border: 2px solid var(--line);
  border-radius: 22px;
  overflow: hidden;
}

.header::before,
.header::after {
  content: "";
  position: absolute;
  top: -30px;
  width: 4px;
  height: 60px;
  background: rgba(42,30,25,0.12);
  border-radius: 4px;
  animation: steam 3.2s ease-in-out infinite;
  filter: blur(1px);
}
.header::before { left: 46%; animation-delay: 0s; }
.header::after  { left: 54%; animation-delay: 1.1s; }

@keyframes steam {
  0%   { transform: translateY(0) scaleY(0.8); opacity: 0; }
  25%  { opacity: .6; }
  60%  { opacity: .35; }
  100% { transform: translateY(-38px) scaleY(1.3); opacity: 0; }
}

.brand-emoji {
  font-size: 3rem;
  display: inline-block;
  transform-origin: 65% 75%;
}

.brand-name {
  font-family: var(--font-display);
  font-size: clamp(28px, 7vw, 36px);
  font-weight: 800;
  color: var(--red-deep);
  letter-spacing: 0.3px;
  margin-top: 6px;
}
.brand-name .amp { color: var(--gold-deep); font-weight: 800; padding: 0 3px; }

.tagline {
  margin-top: 8px;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink-soft);
}

/* ---------------- Nav cards ---------------- */

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media (max-width: 420px) {
  .grid { grid-template-columns: 1fr; }
}

.card {
  --accent: var(--red);
  --accent-soft: var(--paper-2);
  position: relative;
  background: var(--card);
  color: var(--ink);
  text-decoration: none;
  border: 2px solid var(--line);
  border-radius: 20px 20px 12px 12px;
  padding: 22px 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 6px 18px rgba(42, 30, 25, 0.10);
  transform: rotate(var(--tilt, 0deg));
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color .2s ease;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: 62px;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px dashed var(--line);
}
.card:nth-child(odd)  { --tilt: -1deg; }
.card:nth-child(even) { --tilt: 1deg; }

.card:hover,
.card:focus-visible {
  transform: rotate(0deg) translateY(-5px);
  box-shadow: 0 14px 26px rgba(42, 30, 25, 0.18);
  border-color: var(--accent);
}
.card:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
.card:active { transform: rotate(0deg) translateY(-1px) scale(0.98); }

.card-icon {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #FFF7E6 0%, var(--accent-soft) 75%);
  border: 3px solid var(--card);
  box-shadow: 0 4px 10px rgba(42,30,25,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.65rem;
  margin-bottom: 2px;
}
.card-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.3;
  color: var(--accent);
}
.card-sub {
  font-size: 0.78rem;
  color: var(--ink-soft);
  font-weight: 600;
}

.card--gift    { --accent: var(--rose); --accent-soft: #FBE3E9; }
.card--indomie { --accent: var(--red-deep); --accent-soft: #F7DCDC; }
.card--sweets  { --accent: var(--gold-deep); --accent-soft: #FBEBD1; }
.card--snacks  { --accent: var(--green); --accent-soft: #E1F2E8; }

/* ---------------- Entrance motion ---------------- */

@media (prefers-reduced-motion: no-preference) {
  .brand-emoji { animation: wiggle 0.7s ease 0.15s 1 both; }
  .tagline { animation: rise 0.5s ease 0.35s both; }
  .grid .card { opacity: 0; animation: rise 0.5s ease both; }
  .grid .card:nth-child(1) { animation-delay: 0.45s; }
  .grid .card:nth-child(2) { animation-delay: 0.55s; }
  .grid .card:nth-child(3) { animation-delay: 0.65s; }
  .grid .card:nth-child(4) { animation-delay: 0.75s; }
}

@keyframes wiggle {
  0%   { transform: rotate(0deg); }
  25%  { transform: rotate(-10deg); }
  55%  { transform: rotate(8deg); }
  80%  { transform: rotate(-4deg); }
  100% { transform: rotate(0deg); }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px) rotate(var(--tilt, 0deg)); }
  to   { opacity: 1; transform: translateY(0) rotate(var(--tilt, 0deg)); }
}
</style>
</head>
<body>

<main class="container">
    <div class="header">
        <span class="brand-emoji" aria-hidden="true">🍭</span>
        <h1 class="brand-name">dib <span class="amp">&amp;</span> candy</h1>
        <p class="tagline">اختار اللي نفسك فيه 👇</p>
    </div>

    <nav class="grid" aria-label="أقسام المتجر">
        <a href="gift.html" class="card card--gift">
            <span class="card-icon" aria-hidden="true">🎁</span>
            <span class="card-title">بوكسات وبوكيهات</span>
            <span class="card-sub">هدايا حلوة لكل المناسبات</span>
        </a>
        <a href="indomie.html" class="card card--indomie">
            <span class="card-icon" aria-hidden="true">🍜</span>
            <span class="card-title">اندومي وتوبوكي</span>
            <span class="card-sub">نكهات حارة وجامدة</span>
        </a>
        <a href="sweets.html" class="card card--sweets">
            <span class="card-icon" aria-hidden="true">🍭</span>
            <span class="card-title">سويتس وكاندي</span>
            <span class="card-sub">شوكولاتة وكاندي ومجففات</span>
        </a>
        <a href="snacks.html" class="card card--snacks">
            <span class="card-icon" aria-hidden="true">🍟</span>
            <span class="card-title">سناكس</span>
            <span class="card-sub">تشيبس وسناكس متنوعة</span>
        </a>
    </nav>
</main>

</body>
</html>
