<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍭 سويتس وكاندي</title>
    <meta name="description" content="كونو، ويفر، فواكه مجففة وأكثر — اطلب بسهولة وابعت طلبك على واتساب.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
/* ============================================================
   منتجات كوري — هوية بصرية "علبة نودلز"
   الألوان: ورقي دافئ + أحمر قوتشوجانج + ذهبي بيضة + أخضر سوجو
   ============================================================ */

:root {
  --paper: #FBF1DF;
  --paper-2: #F5E6C8;
  --card: #FFFCF5;
  --ink: #2A1E19;
  --ink-soft: #6B564A;
  --red: #D6293A;
  --red-deep: #A81D2C;
  --gold: #F2A93B;
  --gold-deep: #D98826;
  --green: #2E9E68;
  --green-deep: #21774C;
  --line: #E9D6AE;

  --font-display: "Baloo Bhaijaan 2", "Cairo", sans-serif;
  --font-body: "Cairo", sans-serif;

  --radius-lg: 22px;
  --radius-md: 14px;
  --shadow-card: 0 6px 18px rgba(42, 30, 25, 0.10);
  --shadow-pop: 0 10px 28px rgba(214, 41, 58, 0.28);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  background:
    radial-gradient(circle at 15% 0%, #FCEBC9 0%, transparent 45%),
    radial-gradient(circle at 85% 10%, #FBE3C9 0%, transparent 40%),
    var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 96px; /* room for mobile sticky bar */
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

.container {
  max-width: 1320px;
  margin: 0 auto;
  padding: 18px 20px 40px;
}

@media (min-width: 1600px) {
  .container { max-width: 1480px; }
}

/* ---------------- Header ---------------- */

.header {
  position: relative;
  text-align: center;
  padding: 34px 16px 30px;
  margin-bottom: 22px;
  background: linear-gradient(180deg, #FFF6E4 0%, var(--paper) 100%);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.header::before,
.header::after {
  content: "";
  position: absolute;
  top: -30px;
  width: 4px;
  height: 60px;
  background: rgba(42,30,25,0.12);
  border-radius: 4px;
  animation: steam 3.2s ease-in-out infinite;
  filter: blur(1px);
}
.header::before { left: 46%; animation-delay: 0s; }
.header::after  { left: 54%; animation-delay: 1.1s; }

@keyframes steam {
  0%   { transform: translateY(0) scaleY(0.8); opacity: 0; }
  25%  { opacity: .6; }
  60%  { opacity: .35; }
  100% { transform: translateY(-38px) scaleY(1.3); opacity: 0; }
}

.header h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 6vw, 40px);
  margin: 0 0 6px;
  color: var(--red-deep);
  letter-spacing: 0.5px;
}

.header p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 16px;
  font-weight: 600;
}

/* ---------------- Category pills (page nav) ---------------- */

.navigation {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 26px 0 6px;
}

.nav-btn {
  text-decoration: none;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14.5px;
  color: var(--ink);
  background: var(--card);
  border: 2px solid var(--line);
  padding: 10px 20px;
  border-radius: 999px;
  transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
}

.nav-btn:hover {
  transform: translateY(-2px);
  background: var(--gold);
  border-color: var(--gold-deep);
  color: var(--ink);
}

.nav-btn.active {
  background: var(--red);
  border-color: var(--red-deep);
  color: #fff;
}

/* ---------------- Search ---------------- */

.search-wrap {
  margin: 20px 0 8px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  padding: 13px 46px 13px 16px;
  border-radius: var(--radius-md);
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
  transition: border-color .15s ease;
}

.search-wrap input:focus {
  border-color: var(--red);
}

.search-wrap .search-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
  pointer-events: none;
  opacity: 0.6;
}

/* ---------------- Cart summary bar ---------------- */

.cart-summary {
  position: sticky;
  top: 12px;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  box-shadow: var(--shadow-card);
  margin-bottom: 26px;
}

.cart-summary .total {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--red-deep);
}

.cart-summary .total span { font-size: 24px; }

.cart-summary .items-count {
  font-size: 13.5px;
  color: var(--ink-soft);
  font-weight: 600;
  margin-top: 2px;
}

.basket-btn {
  position: relative;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 18px;
  border: 2px solid var(--line);
  background: var(--paper-2);
  border-radius: 999px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease;
}
.basket-btn:hover { transform: translateY(-2px); border-color: var(--gold-deep); }

.basket-badge {
  position: absolute;
  top: -6px;
  left: -6px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--red);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--paper);
}

.order-btn, #clearCartBtn {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14.5px;
  border: none;
  border-radius: 999px;
  padding: 12px 22px;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease;
}

.order-btn {
  background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
  color: #fff;
  box-shadow: 0 8px 18px rgba(46,158,104,0.35);
}

.order-btn:hover { transform: translateY(-2px); }
.order-btn:active { transform: translateY(0); }
.order-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

#clearCartBtn {
  background: transparent;
  color: var(--ink-soft);
  border: 2px solid var(--line);
}
#clearCartBtn:hover { border-color: var(--red); color: var(--red); }

/* ---------------- Section headers ---------------- */

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 30px 2px 16px;
}

.section-title h2 {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
  margin: 0;
  white-space: nowrap;
}

.section-title .line {
  flex: 1;
  height: 2px;
  background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 14px);
}

/* ---------------- Products grid ---------------- */

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 16px;
}

@media (min-width: 900px) {
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
}

.product-card {
  position: relative;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-md) var(--radius-md);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease;
}

.product-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 26px rgba(42,30,25,0.16);
}

.product-media {
  position: relative;
  height: 132px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 40%, #FFF7E6 0%, var(--paper-2) 75%);
  border-bottom: 2px dashed var(--line);
}

.product-media img {
  width: 92px;
  height: 92px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--card);
  box-shadow: 0 4px 10px rgba(42,30,25,0.18);
  background: #fff;
}

.product-media .fallback-emoji {
  font-size: 40px;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 3px solid var(--card);
  box-shadow: 0 4px 10px rgba(42,30,25,0.18);
}

/* price tag — next to quantity / add-to-cart */
.price-tag {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}
.price-tag .old-price-footer {
  font-size: 11px;
  font-weight: 700;
  text-decoration: line-through;
  color: var(--ink-soft);
  opacity: 0.85;
}
.price-tag .current-price {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 16px;
  color: var(--red-deep);
}
.price-tag .current-price small {
  font-size: 11px;
  font-weight: 600;
  margin-right: 2px;
}

.product-info {
  padding: 12px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.product-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  min-height: 38px;
}

.product-footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* stepper */
.stepper {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper-2);
  border-radius: 999px;
  padding: 4px;
}

.stepper button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--red-deep);
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s ease, transform .12s ease;
}
.stepper button:hover { background: var(--gold); transform: scale(1.06); }
.stepper button:active { transform: scale(0.94); }

.stepper .qty {
  min-width: 18px;
  text-align: center;
  font-weight: 700;
  font-size: 14px;
}

.add-btn {
  border: none;
  background: linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
  color: #fff;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 6px 14px rgba(214,41,58,0.30);
  transition: transform .12s ease;
}
.add-btn:hover { transform: translateY(-2px); }
.add-btn:active { transform: translateY(0); }

.product-card.in-cart {
  border-color: var(--red);
}

/* discount / offer badge */
.offer-ribbon {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 2;
  background: var(--gold);
  color: var(--red-deep);
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 10.5px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 2px solid var(--card);
  transform: rotate(8deg);
  box-shadow: 0 3px 8px rgba(42,30,25,0.2);
}

/* ---------------- Empty state ---------------- */

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-soft);
  font-weight: 600;
}
.empty-state .emoji { font-size: 40px; display: block; margin-bottom: 10px; }

/* ---------------- Cart drawer (basket) — shared across all pages ---------------- */

.cart-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(42, 30, 25, 0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
  z-index: 199;
}
.cart-backdrop.show { opacity: 1; pointer-events: auto; }

.cart-drawer {
  position: fixed;
  top: 0;
  left: -100%;
  width: min(360px, 88vw);
  height: 100%;
  background: var(--paper);
  border-left: 2px solid var(--line);
  box-shadow: 12px 0 30px rgba(42,30,25,0.25);
  z-index: 200;
  display: flex;
  flex-direction: column;
  transition: left .3s ease;
}
.cart-drawer.open { left: 0; }

.cart-drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 14px;
  border-bottom: 2px dashed var(--line);
}
.cart-drawer-header h3 {
  font-family: var(--font-display);
  font-size: 19px;
  margin: 0;
  color: var(--red-deep);
}
.drawer-close {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  border: 2px solid var(--line);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  color: var(--ink-soft);
}
.drawer-close:hover { color: var(--red); border-color: var(--red); }

.cart-drawer-items {
  flex: 1;
  overflow-y: auto;
  padding: 10px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.drawer-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.drawer-item-info { flex: 1; min-width: 0; }
.drawer-item-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.drawer-item-price {
  font-size: 12px;
  color: var(--ink-soft);
  font-weight: 600;
  margin-top: 2px;
}
.drawer-remove {
  background: none;
  border: none;
  font-size: 15px;
  cursor: pointer;
  opacity: 0.65;
  transition: opacity .12s ease;
}
.drawer-remove:hover { opacity: 1; }

.cart-drawer-footer {
  padding: 16px 18px 20px;
  border-top: 2px dashed var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--card);
}
.drawer-total {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 19px;
  color: var(--red-deep);
  text-align: center;
}
.cart-drawer-footer .order-btn,
.cart-drawer-footer #drawerClearBtn {
  width: 100%;
  text-align: center;
}
#drawerClearBtn {
  background: transparent;
  color: var(--ink-soft);
  border: 2px solid var(--line);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  padding: 10px;
  border-radius: 999px;
  cursor: pointer;
}
#drawerClearBtn:hover { border-color: var(--red); color: var(--red); }

/* ---------------- Toast ---------------- */

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  padding: 11px 22px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 100;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ---------------- Checkout modal (بيانات الاستلام) ---------------- */

.checkout-modal {
  position: fixed;
  inset: 0;
  z-index: 260;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.checkout-modal.open { opacity: 1; pointer-events: auto; }

@media (min-width: 561px) {
  .checkout-modal { align-items: center; }
}

.checkout-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(42, 30, 25, 0.5);
}

.checkout-sheet {
  position: relative;
  width: 100%;
  max-width: 420px;
  max-height: 92vh;
  overflow-y: auto;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 30px rgba(42,30,25,0.25);
  transform: translateY(24px);
  transition: transform .25s ease;
}
.checkout-modal.open .checkout-sheet { transform: translateY(0); }

@media (min-width: 561px) {
  .checkout-sheet {
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(42,30,25,0.3);
  }
}

.checkout-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 12px;
  border-bottom: 2px dashed var(--line);
}
.checkout-header h3 {
  font-family: var(--font-display);
  font-size: 19px;
  margin: 0;
  color: var(--red-deep);
}
.checkout-header p {
  margin: 4px 0 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  font-weight: 600;
}

.checkout-form {
  padding: 16px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}
.field label .req { color: var(--red); }

.field input,
.field textarea {
  width: 100%;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
  transition: border-color .15s ease;
  resize: vertical;
}
.field input:focus,
.field textarea:focus { border-color: var(--red); }

.field-error {
  display: none;
  font-size: 12px;
  color: var(--red-deep);
  font-weight: 700;
  margin-top: 5px;
}
.field.invalid input,
.field.invalid textarea { border-color: var(--red); }
.field.invalid .field-error { display: block; }

.checkout-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 4px;
}
.checkout-actions .order-btn { width: 100%; text-align: center; }
.checkout-cancel {
  background: transparent;
  color: var(--ink-soft);
  border: 2px solid var(--line);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  padding: 10px;
  border-radius: 999px;
  cursor: pointer;
}
.checkout-cancel:hover { border-color: var(--red); color: var(--red); }


/* ---------------- Responsive ---------------- */

@media (max-width: 560px) {
  .cart-summary {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    top: auto;
    margin-bottom: 0;
    flex-direction: row;
    padding: 10px 14px;
  }
  .cart-summary .total { font-size: 16px; }
  .cart-summary .total span { font-size: 19px; }
  .order-btn, #clearCartBtn { padding: 10px 14px; font-size: 13px; }
  #clearCartBtn { display: none; } /* moved into order flow on mobile to save space */
  .container { padding-bottom: 10px; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
}

/* visible keyboard focus */
a:focus-visible, button:focus-visible, input:focus-visible {
  outline: 3px solid var(--gold-deep);
  outline-offset: 2px;
}

    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>🍭 سويتس وكاندي وشيكولاتات</h1>
            <p>كونو، ويفر، فواكه مجففة وأكثر</p>
        </div>

        <div class="cart-summary">
            <div>
                <div class="total">الإجمالي: <span id="totalPrice">0</span> جنيه</div>
                <div class="items-count" id="itemsCount">0 قطعة</div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <button type="button" class="basket-btn" id="basketToggle" aria-label="افتح السلة">
                    🧺<span class="basket-badge" id="basketBadge">0</span>
                </button>
                <button class="order-btn" onclick="sendOrder()" disabled>📲 إرسال الطلب</button>
                <button id="clearCartBtn" type="button">🗑️ إفراغ السلة</button>
            </div>
        </div>

        <div class="search-wrap">
            <input id="productSearch" type="text" placeholder="دور على حلويات..." autocomplete="off">
            <span class="search-icon">🔍</span>
        </div>

        <div id="productsGrid" class="products-grid"></div>

        <div class="navigation">
            <a href="gift.html" class="nav-btn">🎁 بوكسات وبوكيهات</a>
            <a href="indomie.html" class="nav-btn">🍜 اندومي وتوبوكي</a>
            <a href="snacks.html" class="nav-btn">🍟 سناكس</a>
        </div>
    </div>

    <script>
const pageProducts = [
    { id: 200, name: "شيكولاته دبي ميلك", price: 135, image: "images/484036602_580546431696127_6832759962751218785_n.jpg", category: "🍫 شوكولاتة دبي" },
    { id: 201, name: "شيكولاته دبي وايت", price: 135, image: "images/دبي وايت.webp", category: "🍫 شوكولاتة دبي" },
    { id: 202, name: "شيكولاته دبي كنافه لوتس وايت", price: 135, image: "images/253_9bb80614-f001-45ac-b460-e8d0802bc0cc.webp", category: "🍫 شوكولاتة دبي" },
    { id: 203, name: "شيكولاته دبي كنافه لوز وايت", price: 135, image: "images/6224001733154.webp", category: "🍫 شوكولاتة دبي" },
    { id: 204, name: "شيكولاته دبي كنافه مانجا وايت", price: 135, image: "images/672045025_1290735969866746_8719941423035151247_n.jpg", category: "🍫 شوكولاتة دبي" },
    { id: 205, name: "توبليرون ميلك الماني", price: 105, image: "images/s-l1600.webp", category: "🍬 شوكولاتة وكاندي" },
    { id: 206, name: "كاندي مشكل كيلو", price: 200, image: "images/490812756_1167500255389396_5243865320677183627_n.jpg", category: "🍬 شوكولاتة وكاندي" },
    { id: 207, name: "كونو بايتس 1/2 كيلو", price: 75, image: "images/CopyofIMG_5563_1000x.webp", category: "🧇 ويفر وكونو" },
    { id: 208, name: "ويفر رول 1/2 كيلو", price: 80, image: "images/chocwafrolll_wafer_rolls_chocolate_box_l__cu_1.webp", category: "🧇 ويفر وكونو" },
    { id: 209, name: "فواكه مجففة 100جم", price: 150, image: "images/602366279_1157808943186826_4394455936899410588_n.jpg", category: "🥭 فواكه مجففة" }
];
    </script>
    <script>
/* ============================================================
   محرك السلة المشترك — يعمل على كل صفحات المتجر
   يعتمد على مصفوفة `pageProducts` المُعرَّفة داخل كل صفحة
   ============================================================ */

// 👇 غيّر الرقم ده لرقم واتساب المحل (بصيغة دولية بدون + أو صفر أول)
const WHATSAPP_NUMBER = "201000000000";

const CART_KEY = "korean_shop_cart_v1";

/* ---------- تخزين السلة (يشتغل عبر كل الصفحات) ---------- */

let memoryCart = {}; // fallback لو localStorage مش متاح (زي معاينة Claude)
let storageAvailable = true;

try {
  const testKey = "__storage_test__";
  window.localStorage.setItem(testKey, "1");
  window.localStorage.removeItem(testKey);
} catch (e) {
  storageAvailable = false;
}

function loadCart() {
  if (!storageAvailable) return memoryCart;
  try {
    const raw = window.localStorage.getItem(CART_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCart(cart) {
  if (!storageAvailable) {
    memoryCart = cart;
    return;
  }
  try {
    window.localStorage.setItem(CART_KEY, JSON.stringify(cart));
  } catch (e) {
    memoryCart = cart;
  }
}

let cart = loadCart(); // { [id]: { name, price, qty } }

/* ---------- أدوات مساعدة ---------- */

function formatPrice(n) {
  return n.toLocaleString("ar-EG");
}

function showToast(msg) {
  let toast = document.querySelector(".toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.className = "toast";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove("show"), 1600);
}

/* ---------- عمليات السلة ---------- */

function addToCart(product) {
  const existing = cart[product.id];
  cart[product.id] = {
    name: product.name,
    price: product.price,
    qty: existing ? existing.qty + 1 : 1,
  };
  saveCart(cart);
  renderAll();
  showToast(`✅ اتضاف ${product.name}`);
}

function changeQty(id, delta) {
  const item = cart[id];
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) delete cart[id];
  saveCart(cart);
  renderAll();
}

function removeFromCart(id) {
  if (!cart[id]) return;
  delete cart[id];
  saveCart(cart);
  renderAll();
}

function clearCart() {
  if (Object.keys(cart).length === 0) return;
  const ok = window.confirm("متأكد عايز تفرّغ السلة؟");
  if (!ok) return;
  cart = {};
  saveCart(cart);
  renderAll();
  showToast("🗑️ اتفرغت السلة");
}

function cartTotals() {
  let total = 0;
  let count = 0;
  Object.values(cart).forEach((item) => {
    total += item.price * item.qty;
    count += item.qty;
  });
  return { total, count };
}

/* ---------- بيانات المستلم (تتحفظ عشان متكتبهاش كل مرة) ---------- */

const CUSTOMER_KEY = "korean_shop_customer_v1";

function loadCustomerInfo() {
  if (!storageAvailable) return {};
  try {
    const raw = window.localStorage.getItem(CUSTOMER_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCustomerInfo(info) {
  if (!storageAvailable) return;
  try {
    window.localStorage.setItem(CUSTOMER_KEY, JSON.stringify(info));
  } catch (e) {
    /* ignore */
  }
}

/* ---------- مودال بيانات الاستلام ---------- */

function ensureCheckoutModal() {
  if (document.getElementById("checkoutModal")) return;

  const modal = document.createElement("div");
  modal.className = "checkout-modal";
  modal.id = "checkoutModal";
  modal.innerHTML = `
    <div class="checkout-backdrop" id="checkoutBackdrop"></div>
    <div class="checkout-sheet" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
      <div class="checkout-header">
        <div>
          <h3 id="checkoutTitle">🧾 بيانات الاستلام</h3>
          <p>هنبعت التفاصيل دي مع طلبك على واتساب</p>
        </div>
      </div>
      <form class="checkout-form" id="checkoutForm" novalidate>
        <div class="field" id="fieldName">
          <label for="custName">الاسم <span class="req">*</span></label>
          <input type="text" id="custName" name="name" placeholder="اكتب اسمك" autocomplete="name">
          <div class="field-error">من فضلك اكتب الاسم</div>
        </div>
        <div class="field" id="fieldPhone">
          <label for="custPhone">رقم الموبايل <span class="req">*</span></label>
          <input type="tel" id="custPhone" name="phone" placeholder="01xxxxxxxxx" autocomplete="tel" inputmode="numeric">
          <div class="field-error">اكتب رقم موبايل صحيح (11 رقم)</div>
        </div>
        <div class="field" id="fieldAddress">
          <label for="custAddress">العنوان <span class="req">*</span></label>
          <textarea id="custAddress" name="address" rows="2" placeholder="المحافظة، المنطقة، وأقرب علامة" autocomplete="street-address"></textarea>
          <div class="field-error">من فضلك اكتب العنوان</div>
        </div>
        <div class="field" id="fieldNotes">
          <label for="custNotes">ملاحظات (اختياري)</label>
          <textarea id="custNotes" name="notes" rows="2" placeholder="ميعاد التوصيل المناسب، تفاصيل إضافية..."></textarea>
        </div>
        <div class="checkout-actions">
          <button type="submit" class="order-btn">📲 تأكيد وإرسال الطلب</button>
          <button type="button" class="checkout-cancel" id="checkoutCancel">رجوع للسلة</button>
        </div>
      </form>
    </div>
  `;

  document.body.appendChild(modal);

  document.getElementById("checkoutBackdrop").addEventListener("click", closeCheckoutModal);
  document.getElementById("checkoutCancel").addEventListener("click", closeCheckoutModal);
  document.getElementById("checkoutForm").addEventListener("submit", handleCheckoutSubmit);
}

function openCheckoutModal() {
  const entries = Object.values(cart);
  if (entries.length === 0) {
    showToast("🛒 السلة لسه فاضية");
    return;
  }

  ensureCheckoutModal();

  const saved = loadCustomerInfo();
  document.getElementById("custName").value = saved.name || "";
  document.getElementById("custPhone").value = saved.phone || "";
  document.getElementById("custAddress").value = saved.address || "";
  document.getElementById("custNotes").value = "";

  ["fieldName", "fieldPhone", "fieldAddress"].forEach((id) =>
    document.getElementById(id).classList.remove("invalid")
  );

  closeCartDrawer();
  document.getElementById("checkoutModal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeCheckoutModal() {
  const modal = document.getElementById("checkoutModal");
  if (modal) modal.classList.remove("open");
  document.body.style.overflow = "";
}

function handleCheckoutSubmit(e) {
  e.preventDefault();

  const name = document.getElementById("custName").value.trim();
  const phone = document.getElementById("custPhone").value.trim();
  const address = document.getElementById("custAddress").value.trim();
  const notes = document.getElementById("custNotes").value.trim();

  const phoneOk = /^01[0-9]{9}$/.test(phone.replace(/\s|-/g, ""));

  let valid = true;
  const setInvalid = (fieldId, ok) => {
    const el = document.getElementById(fieldId);
    el.classList.toggle("invalid", !ok);
    if (!ok) valid = false;
  };
  setInvalid("fieldName", name.length > 0);
  setInvalid("fieldPhone", phoneOk);
  setInvalid("fieldAddress", address.length > 0);

  if (!valid) return;

  saveCustomerInfo({ name, phone, address });
  closeCheckoutModal();
  sendOrder({ name, phone, address, notes });
}

/* ---------- بناء رسالة الطلب وإرسالها على واتساب ---------- */

function sendOrder(customer) {
  const entries = Object.values(cart);
  if (entries.length === 0) {
    showToast("🛒 السلة لسه فاضية");
    return;
  }

  if (!customer) {
    openCheckoutModal();
    return;
  }

  const { total, count } = cartTotals();
  let lines = ["📦 *طلب جديد*", ""];
  lines.push(`👤 الاسم: ${customer.name}`);
  lines.push(`📱 الموبايل: ${customer.phone}`);
  lines.push(`📍 العنوان: ${customer.address}`);
  if (customer.notes) lines.push(`📝 ملاحظات: ${customer.notes}`);
  lines.push("");
  lines.push("🛍️ الأصناف:");
  entries.forEach((item) => {
    lines.push(`• ${item.name} × ${item.qty} = ${formatPrice(item.price * item.qty)} جنيه`);
  });
  lines.push("");
  lines.push(`عدد القطع: ${count}`);
  lines.push(`💰 الإجمالي: ${formatPrice(total)} جنيه`);

  const text = encodeURIComponent(lines.join("\n"));
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${text}`;
  window.open(url, "_blank");
  showToast("✅ جاري فتح واتساب لإرسال طلبك");
}

/* ---------- عرض المنتجات ---------- */

function fallbackEmojiFor(category) {
  if (!category) return "🍽️";
  const first = category.trim().split(" ")[0];
  return first || "🍽️";
}

function productCardHTML(product) {
  const inCart = cart[product.id];
  const qty = inCart ? inCart.qty : 0;
  const fallback = fallbackEmojiFor(product.category);
  const hasOffer = typeof product.oldPrice === "number" && product.oldPrice > product.price;

  return `
    <div class="product-card ${qty > 0 ? "in-cart" : ""}" data-id="${product.id}">
      <div class="product-media">
        ${hasOffer ? `<span class="offer-ribbon">🔥 عرض</span>` : ""}
        <img
          src="${product.image}"
          alt="${product.name}"
          loading="lazy"
          onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback-emoji',textContent:'${fallback}'}))"
        />
      </div>
      <div class="product-info">
        <div class="product-name">${product.name}</div>
        <div class="product-footer">
          <div class="price-tag">
            ${hasOffer ? `<span class="old-price-footer">${formatPrice(product.oldPrice)} جنيه</span>` : ""}
            <span class="current-price">${formatPrice(product.price)}<small>جنيه</small></span>
          </div>
          ${
            qty > 0
              ? `<div class="stepper">
                   <button type="button" aria-label="زوّد الكمية" onclick="changeQty(${product.id}, 1)">+</button>
                   <span class="qty">${qty}</span>
                   <button type="button" aria-label="قلّل الكمية" onclick="changeQty(${product.id}, -1)">−</button>
                 </div>`
              : `<button type="button" class="add-btn" onclick='addToCart(${JSON.stringify(product)})'>+ أضف للسلة</button>`
          }
        </div>
      </div>
    </div>
  `;
}

function groupByCategory(products) {
  const groups = new Map();
  products.forEach((p) => {
    const key = p.category || "منتجات";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  return groups;
}

function renderProducts(filterText = "") {
  const grid = document.getElementById("productsGrid");
  if (!grid || typeof pageProducts === "undefined") return;

  const query = filterText.trim();
  const filtered = query
    ? pageProducts.filter((p) => p.name.includes(query))
    : pageProducts;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <span class="emoji">🔍</span>
        مفيش منتجات مطابقة لبحثك
      </div>`;
    return;
  }

  const groups = groupByCategory(filtered);
  let html = "";
  groups.forEach((items, category) => {
    html += `
      <div class="section-title" style="grid-column: 1 / -1;">
        <h2>${category}</h2>
        <div class="line"></div>
      </div>
    `;
    items.forEach((p) => {
      html += productCardHTML(p);
    });
  });

  grid.innerHTML = html;
}

function renderSummary() {
  const { total, count } = cartTotals();
  const totalEl = document.getElementById("totalPrice");
  const countEl = document.getElementById("itemsCount");
  const orderBtn = document.querySelector(".order-btn");

  if (totalEl) totalEl.textContent = formatPrice(total);
  if (countEl) countEl.textContent = `${count} قطعة`;
  if (orderBtn) orderBtn.disabled = count === 0;
}

/* ---------- السلة الجانبية (تفتح من أي صفحة في المتجر) ---------- */

function ensureCartDrawer() {
  if (document.getElementById("cartDrawer")) return;

  const backdrop = document.createElement("div");
  backdrop.className = "cart-backdrop";
  backdrop.id = "cartBackdrop";
  backdrop.addEventListener("click", closeCartDrawer);

  const drawer = document.createElement("aside");
  drawer.className = "cart-drawer";
  drawer.id = "cartDrawer";
  drawer.setAttribute("aria-label", "سلة الطلبات");
  drawer.innerHTML = `
    <div class="cart-drawer-header">
      <h3>🧺 سلة الطلبات</h3>
      <button type="button" class="drawer-close" onclick="closeCartDrawer()" aria-label="اغلاق السلة">×</button>
    </div>
    <div class="cart-drawer-items" id="cartDrawerItems"></div>
    <div class="cart-drawer-footer">
      <div class="drawer-total">الإجمالي: <span id="drawerTotalPrice">0</span> جنيه</div>
      <button type="button" class="order-btn" id="drawerOrderBtn" onclick="sendOrder()">📲 إرسال الطلب</button>
      <button type="button" id="drawerClearBtn">🗑️ إفراغ السلة</button>
    </div>
  `;

  document.body.append(backdrop, drawer);
  document.getElementById("drawerClearBtn").addEventListener("click", clearCart);
}

function openCartDrawer() {
  ensureCartDrawer();
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("cartBackdrop").classList.add("show");
  document.body.style.overflow = "hidden";
  renderDrawer();
}

function closeCartDrawer() {
  const drawer = document.getElementById("cartDrawer");
  const backdrop = document.getElementById("cartBackdrop");
  if (drawer) drawer.classList.remove("open");
  if (backdrop) backdrop.classList.remove("show");
  document.body.style.overflow = "";
}

function renderDrawer() {
  const wrap = document.getElementById("cartDrawerItems");
  if (!wrap) return;

  const entries = Object.entries(cart);

  if (entries.length === 0) {
    wrap.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🧺</span>
        السلة فاضية دلوقتي
      </div>`;
  } else {
    wrap.innerHTML = entries
      .map(
        ([id, item]) => `
      <div class="drawer-item" data-id="${id}">
        <div class="drawer-item-info">
          <div class="drawer-item-name">${item.name}</div>
          <div class="drawer-item-price">${formatPrice(item.price)} جنيه × ${item.qty} = ${formatPrice(item.price * item.qty)} جنيه</div>
        </div>
        <div class="stepper">
          <button type="button" aria-label="زوّد" onclick="changeQty(${id}, 1)">+</button>
          <span class="qty">${item.qty}</span>
          <button type="button" aria-label="قلّل" onclick="changeQty(${id}, -1)">−</button>
        </div>
        <button type="button" class="drawer-remove" onclick="removeFromCart(${id})" aria-label="احذف من السلة">🗑️</button>
      </div>`
      )
      .join("");
  }

  const { total } = cartTotals();
  const totalEl = document.getElementById("drawerTotalPrice");
  const orderBtn = document.getElementById("drawerOrderBtn");
  if (totalEl) totalEl.textContent = formatPrice(total);
  if (orderBtn) orderBtn.disabled = entries.length === 0;
}

function renderAll() {
  const searchInput = document.getElementById("productSearch");
  renderProducts(searchInput ? searchInput.value : "");
  renderSummary();

  const badge = document.getElementById("basketBadge");
  if (badge) {
    const { count } = cartTotals();
    badge.textContent = count;
  }

  const drawer = document.getElementById("cartDrawer");
  if (drawer && drawer.classList.contains("open")) renderDrawer();
}

/* ---------- تشغيل ---------- */

document.addEventListener("DOMContentLoaded", () => {
  ensureCartDrawer();
  renderAll();

  const clearBtn = document.getElementById("clearCartBtn");
  if (clearBtn) clearBtn.addEventListener("click", clearCart);

  const basketBtn = document.getElementById("basketToggle");
  if (basketBtn) basketBtn.addEventListener("click", openCartDrawer);

  const searchInput = document.getElementById("productSearch");
  if (searchInput) {
    searchInput.addEventListener("input", () => renderProducts(searchInput.value));
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeCartDrawer();
      closeCheckoutModal();
    }
  });
});

    </script>
</body>
